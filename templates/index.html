<!DOCTYPE html>
<html>
<head>
  <title>Memory AI Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      width: 420px;
      background: #020617;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #reply {
      margin-top: 15px;
      color: #38bdf8;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>🧠 Memory AI Chat</h2>

    <input id="msg" placeholder="Type your message..." />
    <button onclick="sendMsg()">Send</button>

    <div id="reply"></div>
  </div>

  <script>
    async function sendMsg() {
      const input = document.getElementById("msg");
      const reply = document.getElementById("reply");
      const text = input.value.trim();

      if (!text) {
        reply.innerText = "Type something first";
        return;
      }

      reply.innerText = "Thinking...";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        reply.innerText = data.response;
        input.value = "";
