<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memory AI Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-box {
            background: #020617;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px #000;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-bottom: 10px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #22c55e;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        #response {
            margin-top: 15px;
            background: #020617;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            min-height: 40px;
        }
    </style>
</head>

<body>

<div class="chat-box">
    <h2>🧠 Memory AI Chat</h2>

    <input
        type="text"
        id="message"
        placeholder="Type your message..."
    />

    <button onclick="sendMessage()">Send</button>

    <div id="response"></div>
</div>
<script>
async function sendMessage() {
  const input = document.getElementById("userInput");
  const message = input.value.trim();
  if (!message) return;

  try {
    const response = await fetch("https://memory-ai-project-1.onrender.com/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: message })
    });

    const data = await response.json();
    document.getElementById("response").innerText = data.reply || "No response";
  } catch (error) {
    document.getElementById("response").innerText =
      "Error: Backend connect again";
  }

  input.value = "";
}
</script>

</body>
</html>
